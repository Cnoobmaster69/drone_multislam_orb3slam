colored_pointcloud_node:
  ros__parameters:
    rgb_image_topic: "rgb/image_raw"
    depth_image_topic: "depth/image"
    rgb_info_topic: "rgb/camera_info"
    depth_info_topic: "depth/camera_info"
    output_pointcloud_topic: "camera/colored_pointcloud"
    output_reliable_qos: true

orb_slam3_pointcloud_stitcher:
  ros__parameters:
    # Use "depth/points" if you already have a depth pointcloud topic.
    # Use "camera/colored_pointcloud" to consume the cloud created by depth_image_to_pcl.
    depth_pointcloud_topic: "camera/colored_pointcloud"
    map_data_topic: "map_data"
    output_global_pointcloud_topic: "global_pointcloud"
    input_pointcloud_rate: 10.0
    use_normalized_time_diff: false
    robot_base_frame: "base_link" # should be the same frame as the one used in the slam
